data_dir: data
cohort_name: default_cohort
eyes_condition: closed
results_dir: results

train:
  test_size: 0.2
  random_state: 42
  xgb_n_estimators: 400
  xgb_max_depth: 8
  xgb_learning_rate: 0.05
  xgb_subsample: 0.9
  xgb_colsample_bytree: 0.9
  xgb_reg_lambda: 1.0

output:
  metrics_json: results/classification/reve_xgb_metrics.json
